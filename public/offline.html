<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0e15" />
    <title>Offline · Media Creative</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0a0e15;
        color: #e9eef6;
        font-family: "Segoe UI", Arial, Helvetica, sans-serif;
        text-align: center;
      }
      .card { max-width: 360px; }
      img { width: 120px; height: auto; margin-bottom: 20px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.6; color: #a4afc0; margin: 0 0 20px; }
      button {
        font: inherit;
        font-weight: 600;
        font-size: 14px;
        color: #04161d;
        background: #22d3ee;
        border: 0;
        border-radius: 8px;
        padding: 10px 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/logo.png" alt="Media Creative" />
      <h1>You're offline</h1>
      <p>The Control Center needs an internet connection to show live modem, tour and invoice data. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
